[theme]
base = "dark"
primaryColor = "#6C63FF"
backgroundColor = "#0A0D14"
secondaryBackgroundColor = "#12151F"
textColor = "#F0F2F6"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 500  # in MB, supports large classroom video/audio recordings

[browser]
gatherUsageStats = false
